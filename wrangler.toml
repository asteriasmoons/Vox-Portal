# Vox Bugs Bot — Cloudflare Worker configuration.
# Replace REPLACE_* values before first deploy.

name = "vox-bugs-bot"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# Static Mini App assets are served from /public
[assets]
directory = "./public"
binding = "ASSETS"

# ── D1 database ─────────────────────────────────────────────
# Create with:  wrangler d1 create vox_bugs
# Then paste the returned database_id here.
[[d1_databases]]
binding = "DB"
database_name = "vox_bugs"
database_id = "8a792b49-c497-4abd-a9dd-7270f4e8e4d7"

# ── R2 bucket for attachments ───────────────────────────────
# Create with:  wrangler r2 bucket create vox-bugs-attachments
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "vox-bugs-attachments"

# ── KV namespace for /bug conversation sessions ─────────────
# Create with:  wrangler kv namespace create SESSIONS
[[kv_namespaces]]
binding = "SESSIONS"
id = "a20bed8a035140eea3087a16322c3ad9"

# ── Non-secret vars ─────────────────────────────────────────
[vars]
BOT_USERNAME = "VoxBugsBot"
MINIAPP_SHORT_NAME = "bugs"
PUBLIC_ORIGIN = "https://bugs.voxiverse.ink"

# ── Secrets (set with `wrangler secret put NAME`) ───────────
# TELEGRAM_BOT_TOKEN     — from @BotFather
# TELEGRAM_WEBHOOK_SECRET — random string used as X-Telegram-Bot-Api-Secret-Token
# CHANNEL_ID             — numeric id of the Bug Reports channel (e.g. -1001234567890)
# DISCUSSION_CHAT_ID     — numeric id of the linked discussion group (e.g. -1009876543210)
# ADMIN_TELEGRAM_IDS     — comma-separated Telegram user IDs allowed to manage bugs
