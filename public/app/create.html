<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Create · Vox Bugs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="create-landing">
    <div id="tg-safe-top" aria-hidden="true"></div>
    <main id="app">
      <header class="hdr">
        <h1 class="page-title">Create</h1>
        <p class="sub">What would you like to submit?</p>
      </header>

      <a class="create-card" href="./create-bug.html" aria-label="Report a bug">
        <img class="create-card-glyph create-card-glyph-white" src="/icons/cutebug.svg" alt="" />
        <div class="create-card-body">
          <div class="create-card-title">Report a Bug</div>
          <div class="create-card-desc">Something's broken or not working the way it should. Send us the details.</div>
          <div class="create-card-cta">Report →</div>
        </div>
      </a>

      <a class="create-card" href="./create-idea.html" aria-label="Submit an idea">
        <img class="create-card-glyph create-card-glyph-white" src="/icons/decorbulb.svg" alt="" />
        <div class="create-card-body">
          <div class="create-card-title">Submit an Idea</div>
          <div class="create-card-desc">A feature you'd love to see. We'll add it to that app's Ideas discussion on GitHub.</div>
          <div class="create-card-cta">Submit →</div>
        </div>
      </a>
    </main>

    <nav id="nav" aria-label="Primary">
      <a class="nav-btn" href="./index.html" aria-label="Home">
        <img class="nav-glyph" src="/icons/home.svg" alt="" />
        <span class="nav-label">Home</span>
      </a>
      <a class="nav-btn active" href="./create.html" aria-label="Create" aria-current="page">
        <img class="nav-glyph" src="/icons/create.svg" alt="" />
        <span class="nav-label">Create</span>
      </a>
      <a class="nav-btn" href="./history.html" aria-label="History">
        <img class="nav-glyph" src="/icons/clockbook.svg" alt="" />
        <span class="nav-label">History</span>
      </a>
    </nav>

    <script type="module" src="./app.js"></script>
  </body>
</html>
