<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vox Bugs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="home">
    <div id="tg-safe-top" aria-hidden="true"></div>
    <main id="app">
      <div class="home-hero">
        <img class="home-glyph" src="/icons/bugcircle.svg" alt="" />
        <h1 class="page-title">Vox Bugs</h1>
        <p class="sub">Structured bug reports for every Vox app.<br />Faster fixes, clearer updates.</p>
      </div>

      <div class="card home-actions">
        <a class="primary nav-link" href="./create.html">Report a bug</a>
        <a class="ghost nav-link" href="./history.html">View my reports</a>
      </div>

      <div class="card home-tips">
        <h2>How it works</h2>
        <ol class="tips">
          <li>Pick the app and describe what happened.</li>
          <li>Add screenshots or a screen recording.</li>
          <li>Get status updates right here as we fix it.</li>
        </ol>
      </div>
    </main>
    <nav id="nav" aria-label="Primary">
      <a class="nav-btn active" href="./index.html" style="--icon:url(/icons/home.svg)" aria-label="Home" aria-current="page">
        <img class="nav-glyph" src="/icons/home.svg" alt="" />
        <span class="nav-label">Home</span>
      </a>
      <a class="nav-btn" href="./create.html" style="--icon:url(/icons/create.svg)" aria-label="Report a bug">
        <img class="nav-glyph" src="/icons/create.svg" alt="" />
        <span class="nav-label">Create</span>
      </a>
      <a class="nav-btn admin-only-nav hidden" href="./callbacks.html" style="--icon:url(/icons/starchat.svg)" aria-label="Callbacks">
        <img class="nav-glyph" src="/icons/starchat.svg" alt="" />
        <span class="nav-label">Callbacks</span>
      </a>
      <a class="nav-btn" href="./history.html" style="--icon:url(/icons/clockbook.svg)" aria-label="My reports">
        <img class="nav-glyph" src="/icons/clockbook.svg" alt="" />
        <span class="nav-label">History</span>
      </a>
    </nav>

    <script type="module" src="./app.js"></script>
  </body>
</html>
