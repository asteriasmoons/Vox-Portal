<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My Reports · Vox Bugs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="history">
    <div id="tg-safe-top" aria-hidden="true"></div>
    <main id="app">
      <header class="hdr">
        <h1 class="page-title">My Reports</h1>
        <p class="sub">Every bug you've filed and its current status.</p>
      </header>

      <div id="history-empty" class="card empty hidden">
        <p>No reports yet. When you file one, it'll show up here.</p>
        <a class="primary nav-link" href="./create.html">Report a bug</a>
      </div>
      <div id="history-loading" class="card empty">Loading…</div>
      <ul id="history-list" class="history hidden"></ul>
    </main>

    <nav id="nav" aria-label="Primary">
      <a class="nav-btn" href="./index.html" aria-label="Home">
        <img class="nav-glyph" src="/icons/home.svg" alt="" />
        <span class="nav-label">Home</span>
      </a>
      <a class="nav-btn" href="./create.html" aria-label="Report a bug">
        <img class="nav-glyph" src="/icons/create.svg" alt="" />
        <span class="nav-label">Create</span>
      </a>
      <a class="nav-btn active" href="./history.html" aria-label="My reports" aria-current="page">
        <img class="nav-glyph" src="/icons/clockbook.svg" alt="" />
        <span class="nav-label">History</span>
      </a>
    </nav>

    <script type="module" src="./app.js"></script>
  </body>
</html>
